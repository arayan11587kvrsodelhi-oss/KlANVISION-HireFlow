[alembic]
# Root-level Alembic config. Run migrations from the project root:
#   alembic upgrade head
#   alembic revision --autogenerate -m "message"
prepend_sys_path = .
# Explicit separator avoids Alembic's legacy space/comma splitting of the path.
path_separator = os

script_location = alembic

# The URL is injected at runtime by alembic/env.py from app.config.Settings
# (i.e. from the NEON_DSN environment variable / .env file). The value below is
# never used and contains no credentials.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Naming convention is defined on Base.metadata (app/db/base.py) so
# autogenerate produces stable constraint names.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
