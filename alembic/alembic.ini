[alembic]
# Python path to the package containing models
prepend_path = .

# Alembic script location
script_location = ./alembic

# SQLAlchemy database URL - read from .env via run_time_upgrade
# This will be overridden at runtime by the run.py script
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/hrflow

# Logging configuration
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)s [%(name)s][%(filename)s:%(lineno)d] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[plugin_helpers]