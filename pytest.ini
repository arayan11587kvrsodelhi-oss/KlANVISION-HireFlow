[tool:pytest]
# Root directory for test discovery
testpaths =
    ["tests",
     "app/tests",
     "conftest.py"]

# Markers that are allowed without registration
markers =
    db: Database fixture test
    auth: Authentication test
    integration: Integration test
    slow: Slow test (requires DB)

# Add conftest.py discovery
confcutdir = .

# Python files to locate tests
python_files = "(*_test.py, test_*.py)"

# Add verbose output by default
addopts = "-v"

# Capture stdout output
capture = "stdout"

# Warn if no tests are collected
usefixtures = ["db_session"]

# Default test timeout (in seconds)
# timeout = 60