[pytest]
# Test discovery. Only real test modules are collected; conftest.py is not a
# test file (listing it here previously caused collection noise).
testpaths = tests

python_files = test_*.py
python_functions = test_*

markers =
    integration: Exercises the API over HTTP against a real database
    security: Authorization / isolation regression test
    slow: Slow test

# -q keeps the output readable; use -v locally when debugging.
addopts = -q --strict-markers

# pytest-asyncio is installed transitively (no async tests exist). Its plugin
# warns that the default fixture loop scope is unset; pin it to the value the
# plugin documents as current behaviour, so the warning is resolved, not hidden.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:passlib.*
